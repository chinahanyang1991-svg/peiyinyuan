[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peiyinyuan"
version = "1.0.0"
description = "配音员 - 下一代电子书转有声书整合工具"
authors = [
    {name = "配音员开发团队"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup",
]

# ---------- 核心依赖 ----------
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",           # 文件上传支持
    "websockets>=12.0",                   # WebSocket 支持

    # 数据库
    "sqlalchemy>=2.0.30",

    # 异步任务
    "celery>=5.4.0",
    "redis>=5.0.0",

    # 电子书解析
    "ebooklib>=0.18",
    "pymupdf>=1.24.0",                   # PDF 解析
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",                    # 编码检测

    # 文本处理
    "jieba>=0.42.1",                     # 中文分词
    "pypinyin>=0.51.0",                  # 拼音转换（多音字校正）
    "cn2an>=0.5.22",                     # 中文数字转换

    # 音频处理
    "numpy>=1.24.0",                     # 采样级运算（mixer/audio_postprocess 直呼 import）
    "pydub>=0.25.1",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "soxr>=0.3.0",                       # 混合引擎统一采样率重采样 (PY-116)

    # 爬虫
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "parsel>=1.9.0",
    "playwright>=1.44.0",

    # 工具
    "pillow>=10.3.0",                    # 图像处理（封面）
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
# ---------- TTS 引擎依赖（按需安装）----------
voxcpm = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
]
kokoro = [
    "kokoro>=0.7.0",
    # PY-367（2026-09-27 实测）：只装 kokoro 一枚时英文能出声，BUILTIN_VOICES 里
    # 那 6 枚中文音色（zf_/zm_）会在合成期 ModuleNotFoundError: ordered_set ——
    # 中文支路的 G2P 由 misaki[zh] 提供，espeak-ng 音库由 espeakng-loader 自带。
    "misaki[zh]>=0.7.0",
    "phonemizer>=3.3.0",
    "espeakng-loader>=0.2.4",
]
# 在线快速档 (PY-116): 微软 Edge 神经音色, 无需 GPU, 单句 ~1-2.5s, 可并发
edgetts = [
    "edge-tts>=7.0.0",
]
mosstts = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "torchaudio>=2.3.0",
    "librosa>=0.10.0",
]
# GPU 加速
gpu = [
    "torch>=2.3.0",
]
# 编解码兜底 (PY-302): mp3/m4b 需要 ffmpeg; PATH 无 ffmpeg 时
# modules/tts_engine/ffmpeg_utils.py 会探测并使用 imageio-ffmpeg 自带静态可执行文件
codecs = [
    "imageio-ffmpeg>=0.4.9",
]
# 全量安装
all = [
    "peiyinyuan[voxcpm,kokoro,gpu,codecs]",
]
# 开发依赖
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/peiyinyuan/peiyinyuan"
Documentation = "https://github.com/peiyinyuan/peiyinyuan/wiki"
Issues = "https://github.com/peiyinyuan/peiyinyuan/issues"

# 包清单自动发现：手写清单会漂（曾经缺 modules.cast_analyzer/mixer/memory、
# 又列着已删的空壳 modules.dubbing_studio），改成按目录扫，新增子包无需回来改这里。
[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "modules*"]

# ---------- 工具配置 ----------
[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"